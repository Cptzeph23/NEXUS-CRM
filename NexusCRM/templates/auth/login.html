

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In · NexusCRM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --primary: #5b5bd6;
            --primary-dark: #4949bd;
        }

        * {
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            margin: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #f6f7fc,
                    #eef0f8
                );

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

        }

        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }

        .login-brand {

            text-align: center;

            margin-bottom: 30px;

        }

        .brand-logo {

            width: 48px;
            height: 48px;

            margin: 0 auto 12px;

            border-radius: 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: var(--primary);

            color: white;

            font-size: 22px;

            font-weight: 800;

            box-shadow:
                0 8px 25px rgba(91, 91, 214, .25);

        }

        .brand-name {

            font-size: 23px;

            font-weight: 700;

            color: #1d2430;

        }

        .brand-description {

            color: #89919f;

            font-size: 12px;

            margin-top: 4px;

        }

        .login-card {

            background: white;

            border: 1px solid #e6e8ed;

            border-radius: 13px;

            padding: 32px;

            box-shadow:
                0 15px 45px rgba(31, 41, 55, .07);

        }

        .login-title {

            font-size: 20px;

            font-weight: 700;

            color: #1d2430;

            margin-bottom: 5px;

        }

        .login-subtitle {

            font-size: 11px;

            color: #89919f;

            margin-bottom: 25px;

        }

        .form-label {

            font-size: 11px;

            font-weight: 600;

            color: #4b5563;

            margin-bottom: 7px;

        }

        .form-control {

            height: 43px;

            border-color: #e2e5eb;

            border-radius: 7px;

            font-size: 12px;

        }

        .form-control:focus {

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(91, 91, 214, .10);

        }

        .login-button {

            width: 100%;

            height: 43px;

            border: none;

            border-radius: 7px;

            background: var(--primary);

            color: white;

            font-size: 12px;

            font-weight: 600;

            margin-top: 8px;

            transition: .15s ease;

        }

        .login-button:hover {

            background: var(--primary-dark);

        }

        .login-footer {

            text-align: center;

            margin-top: 20px;

            color: #9aa1ad;

            font-size: 10px;

        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-brand">

        <div class="brand-logo">
            N
        </div>

        <div class="brand-name">
            NexusCRM
        </div>

        <div class="brand-description">
            Customer Relationship Management Platform
        </div>

    </div>


    <div class="login-card">

        <h1 class="login-title">
            Welcome back
        </h1>

        <p class="login-subtitle">
            Sign in to access your CRM workspace.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div
                    class="alert alert-danger py-2"
                    style="font-size: 11px;"
                >

                    <i class="bi bi-exclamation-circle me-1"></i>

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ next|default:'' }}"
            >


            <div class="mb-3">

                <label
                    class="form-label"
                    for="username"
                >
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="mb-4">

                <label
                    class="form-label"
                    for="password"
                >
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                Sign in

                <i class="bi bi-arrow-right ms-1"></i>

            </button>

        </form>

    </div>


    <div class="login-footer">

        NexusCRM · Secure Business Management

    </div>

</div>

</body>

</html>
